[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ritron-api"
version = "0.1.0"
description = "RITRON AI core API foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pre-commit>=4.3.0,<5.0.0",
  "pytest>=9.0.3,<10.0.0",
  "ruff>=0.12.0,<1.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/ritron_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "integration: verifies component interactions",
  "e2e: verifies an externally visible API contract"
]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["apps/api/src", "apps/api/tests"]
python_version = "3.13"
strict = true
warn_unused_configs = true
